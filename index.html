<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos - Muro Villa das Artes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map">
        <!-- O mapa será renderizado aqui -->
        <!-- Você pode adicionar uma mensagem de carregamento se desejar -->
        <!-- <div id="map-loading">Carregando mapa...</div> -->
    </div>

    <!-- Carrega os dados dos marcadores primeiro -->
    <script src="marcadores.js"></script>

    <!-- Carrega o script principal do mapa -->
    <script src="script.js"></script>

    <!--
    Carrega a API do Google Maps.
    Substitua YOUR_API_KEY pela sua chave de API real.
    O parâmetro 'callback=initMap' chama a função initMap após o carregamento da API.
    'libraries=marker,maps' carrega as bibliotecas necessárias para AdvancedMarkerElement e Maps.
    'v=beta' é frequentemente recomendado para usar os recursos mais recentes como AdvancedMarkerElement.
    -->
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCiQ2xK6aeawbTlImwHI7SlXLUEhNrA6EY&callback=initMap&libraries=marker,maps&v=beta">
    </script>
</body>
</html>
